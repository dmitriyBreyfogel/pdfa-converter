services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "--max-time", "2", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
